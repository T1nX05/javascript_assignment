<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Assignment 3</title>
  </head>

  <body>
    <h3>Open browser console to see the result</h3>

    <script>
      // Given array
      const people = [
        "Alice Anderson",
        "Aaron Adams",
        "Bella Brown",
        "Brian Black",
        "Cathy Carter",
        "Charles Cooper",
        "Diana Davis",
        "Daniel Drake",
        "Ella Evans",
        "Ethan Edwards",
        "Fiona Fisher",
        "Frank Foster",
        "Grace Green",
        "Gavin Gray",
        "Hannah Harris",
        "Henry Hill",
        "Isabella Ingram",
        "Ian Irving",
        "Jack Johnson",
        "Julia James"
      ];

      // Choose starting letter (hardcoded)
      const letter = "B";

      // Use filter() to get names starting with the letter
      const result = people.filter((name) => {
        return name.charAt(0) === letter;
      });

      // Display result in console
      console.log(result);
    </script>
  </body>
</html>
